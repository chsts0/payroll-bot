name: bot

# Бот работает ~5 ч 45 мин, затем останавливается.
# Расписание каждые 20 минут держит «в очереди» следующий запуск,
# и он стартует сразу, как только текущий закончился (перерыв ~1 минута).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fonts
        run: ls /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)

      # GitHub выключает расписание в репозиториях без активности 60 дней — не даём ему это сделать
      - name: Keep schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          COMPANY_NAME: EYEPHOTO
          RUN_MINUTES: "345"
